<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Diri</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.container {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 40px;
    width: 350px;
    text-align: center;
    box-shadow: 0 25px 40px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.3);
    transition: 0.4s;
}

.container:hover {
    transform: translateY(-10px) scale(1.02);
}

/* FOTO */
.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    margin-bottom: 15px;
}

/* TITLE */
h1 {
    color: white;
    margin-bottom: 5px;
}

.subtitle {
    color: #e0f7ff;
    font-size: 14px;
    margin-bottom: 25px;
}

/* BIODATA */
.biodata {
    text-align: left;
    color: white;
}

.item {
    background: rgba(255,255,255,0.2);
    padding: 10px 15px;
    border-radius: 10px;
    margin-bottom: 10px;
    transition: 0.3s;
}

.item:hover {
    background: rgba(255,255,255,0.35);
    transform: translateX(5px);
}

.label {
    font-weight: 600;
}

/* BUTTON */
.btn {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #0077ff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #0077ff;
    color: white;
}
</style>
</head>
<body>

<div class="container">

    <!-- FOTO (ganti link gambarnya kalau mau) -->
    <img src="./okta.png" alt="Foto Profil" class="profile-img">

    <p class="subtitle">Hallo Hallo</p>

    <div class="biodata">
        <div class="item"><span class="label">Nama:</span> Okta Kurnia Ariansyah</div>
        <div class="item"><span class="label">Umur:</span> 20 Tahun</div>
        <div class="item"><span class="label">Pekerjaan:</span> Mahasiswa</div>
        <div class="item"><span class="label">Tanggal Lahir:</span> 28 Oktober 2006</div>
        <div class="item"><span class="label">Alamat:</span> Jalan Kapuas V No 70 </div>
        <div class="item"><span class="label">Ayah:</span> Rizal</div>
        <div class="item"><span class="label">Ibu:</span> Asni</div>
    </div>

    <button class="btn" onclick="alert('Terima kasih sudah melihat biodata ini hehehe 😊')">
        TERIMAKASIH SUDAH MELIHAT
    </button>

</div>

</body>
</html>
